<!-- ══════════════════ PAGE: CUSTOM ORDER ══════════════════ -->

<div class="bg-beige pt-24 pb-16 text-center border-b border-gray-200">
    <span class="text-maroon uppercase tracking-widest text-sm font-semibold">Bespoke Nail Sets</span>
    <h1 class="font-serif text-4xl md:text-6xl text-maroon mt-3 mb-4">Design Your Dream Nails</h1>
    <p class="text-gray-500 font-light max-w-xl mx-auto px-4">
        Tell us your vision and we'll handcraft a one-of-a-kind set just for you. Ships worldwide.
    </p>
</div>

<div class="max-w-4xl mx-auto px-6 py-16">
    <!-- Form submitted by backend/api/orders.js → handleOrderSubmit() -->
    <form id="custom-order-form"
          class="space-y-12 bg-white p-8 rounded-3xl shadow-lg border border-gray-100">

        <div>
            <h3 class="font-serif text-2xl text-maroon border-b border-gray-100 pb-3 mb-6">
                1. Contact Information
            </h3>
            <div class="grid md:grid-cols-2 gap-6">
                <input type="text" id="co-name" placeholder="Full Name *" required
                       class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-maroon outline-none bg-gray-50 transition-colors">
                <input type="text" id="co-city" placeholder="City *" required
                       class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-maroon outline-none bg-gray-50 transition-colors">
            </div>
        </div>

        <div>
            <h3 class="font-serif text-2xl text-maroon border-b border-gray-100 pb-3 mb-6">
                2. Nail Specifications
            </h3>
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Shape</label>
                    <select id="co-shape" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:border-maroon outline-none transition-colors">
                        <option value="Almond">Almond</option>
                        <option value="Square">Square</option>
                        <option value="Coffin">Coffin</option>
                        <option value="Stiletto">Stiletto</option>
                        <option value="Round">Round</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Length</label>
                    <select id="co-length" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:border-maroon outline-none transition-colors">
                        <option value="Short">Short</option>
                        <option value="Medium">Medium</option>
                        <option value="Long">Long</option>
                        <option value="Extra Long">Extra Long</option>
                    </select>
                </div>
            </div>
        </div>

        <div>
            <h3 class="font-serif text-2xl text-maroon border-b border-gray-100 pb-3 mb-6">
                3. Design &amp; Budget
            </h3>
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Design Description *</label>
                    <textarea id="co-desc" required rows="4"
                              placeholder="Describe your design — colours, patterns, references..."
                              class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:border-maroon outline-none transition-colors resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Budget Range</label>
                    <select id="co-budget" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50 focus:border-maroon outline-none transition-colors">
                        <option value="₹500 - ₹1000">₹500 – ₹1,000</option>
                        <option value="₹1000 - ₹2000">₹1,000 – ₹2,000</option>
                        <option value="₹2000+">₹2,000+</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit"
                class="w-full bg-maroon text-white py-4 rounded-xl text-lg font-medium
                       hover:bg-maroon-dark transition-colors cursor-hover flex items-center justify-center gap-2">
            <i class="ph ph-paper-plane-tilt"></i> Submit Custom Order
        </button>
    </form>
</div>
