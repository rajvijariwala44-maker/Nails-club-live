<!-- ══════════════════ PAGE: ADMIN DASHBOARD ══════════════════ -->

<!-- Sticky Topbar -->
<div class="bg-dark text-white px-6 py-4 flex flex-col md:flex-row justify-between items-center
            mb-8 gap-4 shadow-md sticky top-0 z-40">
    <div class="font-serif text-xl flex items-center gap-2">
        <i class="ph ph-shield-check text-maroon"></i> AURA Portal
        <span class="text-xs bg-green-500 text-white px-2 py-0.5 rounded-full font-sans ml-2 tracking-wider">
            LIVE SYNC
        </span>
    </div>
    <div class="flex gap-3 w-full md:w-auto">
        <!-- Calls backend/state.js → saveGlobalState() -->
        <button id="admin-save-btn" onclick="saveGlobalState()"
                class="flex-1 md:flex-none bg-green-600 hover:bg-green-700 text-white px-5 py-2.5
                       rounded-lg transition-colors text-sm font-bold flex items-center justify-center
                       gap-2 shadow-lg shadow-green-900/50">
            <i class="ph ph-floppy-disk text-lg"></i> Save Website Changes
        </button>
        <button id="admin-logout-btn"
                class="text-sm bg-white/10 hover:bg-white/20 px-4 py-2.5 rounded transition-colors">
            Logout
        </button>
    </div>
</div>

<div class="max-w-7xl mx-auto px-6">

    <!-- Tab Navigation -->
    <div class="flex gap-2 mb-6 border-b border-gray-200 overflow-x-auto pb-2 scrollbar-hide">
        <button class="admin-tab active whitespace-nowrap pb-3 px-4 border-b-2 border-maroon text-maroon font-medium text-sm"
                data-target="admin-appointments">
            <i class="ph ph-calendar-check mr-1"></i> Appointments
        </button>
        <button class="admin-tab whitespace-nowrap pb-3 px-4 border-b-2 border-transparent text-gray-500 text-sm"
                data-target="admin-custom-orders">
            <i class="ph ph-sparkle mr-1"></i> Custom Orders
        </button>
        <button class="admin-tab whitespace-nowrap pb-3 px-4 border-b-2 border-transparent text-gray-500 text-sm"
                data-target="admin-media">
            <i class="ph ph-images mr-1"></i> Media Library
        </button>
        <button class="admin-tab whitespace-nowrap pb-3 px-4 border-b-2 border-transparent text-gray-500 text-sm"
                data-target="admin-cms">
            <i class="ph ph-browser mr-1"></i> CMS Editor
        </button>
        <button class="admin-tab whitespace-nowrap pb-3 px-4 border-b-2 border-transparent text-gray-500 text-sm"
                data-target="admin-store">
            <i class="ph ph-storefront mr-1"></i> Services &amp; Store
        </button>
    </div>

    <!-- ── Appointments ── -->
    <div id="admin-appointments" class="admin-pane bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 text-sm border-b border-gray-100">
                        <th class="p-4 font-medium">Client</th>
                        <th class="p-4 font-medium">Service</th>
                        <th class="p-4 font-medium">Date &amp; Time</th>
                        <th class="p-4 font-medium">Status</th>
                    </tr>
                </thead>
                <!-- Populated by frontend/js/render.js → renderAdminAppointments() -->
                <tbody id="admin-appt-table-body" class="divide-y divide-gray-100 text-sm"></tbody>
            </table>
        </div>
    </div>

    <!-- ── Custom Orders ── -->
    <div id="admin-custom-orders" class="admin-pane hidden bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 text-sm border-b border-gray-100">
                        <th class="p-4 font-medium">Order ID</th>
                        <th class="p-4 font-medium">Customer</th>
                        <th class="p-4 font-medium">Nail Specs</th>
                        <th class="p-4 font-medium">Budget</th>
                        <th class="p-4 font-medium text-right">Status</th>
                    </tr>
                </thead>
                <!-- Populated by frontend/js/render.js → renderAdminCustomOrders() -->
                <tbody id="admin-custom-orders-body" class="divide-y divide-gray-100 text-sm"></tbody>
            </table>
        </div>
    </div>

    <!-- ── Media Library ── -->
    <div id="admin-media" class="admin-pane hidden">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6
                    flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h3 class="font-medium text-lg">Central Media Library</h3>
                <p class="text-xs text-gray-500 mt-1">Images stored as Base64 via localStorage.</p>
            </div>
            <!-- Upload handled by backend/api/media.js → handleLibraryUpload() -->
            <button class="bg-maroon text-white px-4 py-2 rounded-lg text-sm hover:bg-maroon-dark
                           transition-colors flex items-center gap-2 cursor-hover"
                    onclick="document.getElementById('library-upload').click()">
                <i class="ph ph-upload-simple"></i> Upload Image
            </button>
            <input type="file" id="library-upload" accept="image/*" class="hidden"
                   onchange="handleLibraryUpload(event)">
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="filterMedia('All')"
                    class="px-3 py-1 bg-dark text-white rounded-full text-xs cursor-hover">All</button>
            <button onclick="filterMedia('Banners')"
                    class="px-3 py-1 bg-white border border-gray-200 text-gray-600 rounded-full text-xs hover:border-maroon cursor-hover">Banners</button>
            <button onclick="filterMedia('Catalog')"
                    class="px-3 py-1 bg-white border border-gray-200 text-gray-600 rounded-full text-xs hover:border-maroon cursor-hover">Catalog</button>
            <button onclick="filterMedia('Services')"
                    class="px-3 py-1 bg-white border border-gray-200 text-gray-600 rounded-full text-xs hover:border-maroon cursor-hover">Services</button>
        </div>

        <!-- Populated by frontend/js/render.js → renderMediaLibrary() -->
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4" id="admin-media-grid"></div>
    </div>

    <!-- ── CMS / Visual Editor ── -->
    <div id="admin-cms" class="admin-pane hidden space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h3 class="font-serif text-2xl text-maroon mb-6 flex items-center gap-2">
                <i class="ph ph-browser"></i> Direct Visual Editor
            </h3>
            <div class="border border-gray-200 rounded-xl p-6 max-w-3xl space-y-5">
                <h4 class="font-medium text-lg">Hero Section</h4>

                <!-- Hero Image — upload handled by backend/api/media.js -->
                <div class="bg-gray-50 p-4 border border-gray-200 rounded-lg">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Background Image</label>
                    <div class="relative group w-full h-44 rounded-lg overflow-hidden border border-gray-200 bg-gray-200">
                        <img id="cms-hero-img-preview" src="" alt="Hero preview"
                             class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-dark/60 opacity-0 group-hover:opacity-100
                                    transition-opacity flex items-center justify-center backdrop-blur-sm">
                            <button class="bg-white text-dark px-3 py-2 text-sm rounded-lg shadow
                                           flex items-center gap-1 hover:bg-maroon hover:text-white transition-colors"
                                    onclick="document.getElementById('hero-img-upload').click()">
                                <i class="ph ph-upload-simple"></i> Replace Image
                            </button>
                            <input type="file" id="hero-img-upload" accept="image/*" class="hidden"
                                   onchange="handleHeroImageUpload(event)">
                        </div>
                    </div>
                </div>

                <!-- Hero Headline — live preview via frontend/js/render.js → updateLiveHeroText() -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Main Headline</label>
                    <textarea id="cms-hero-main" rows="2"
                              class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none
                                     focus:border-maroon transition-colors text-sm bg-gray-50"
                              oninput="updateLiveHeroText()"></textarea>
                    <p class="text-xs text-gray-400 mt-1">HTML allowed — e.g. &lt;br&gt;, &lt;i&gt;</p>
                </div>

                <!-- Hero Subheadline -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Subheadline</label>
                    <textarea id="cms-hero-desc" rows="2"
                              class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none
                                     focus:border-maroon transition-colors text-sm bg-gray-50"
                              oninput="updateLiveHeroText()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Services & Store ── -->
    <div id="admin-store" class="admin-pane hidden space-y-6">
        <div class="grid md:grid-cols-2 gap-6">

            <!-- Services Manager — CRUD via backend/api/services.js -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                    <h3 class="font-medium text-lg">Services Menu</h3>
                    <button onclick="openAddServiceModal()"
                            class="bg-maroon text-white text-sm px-3 py-1.5 rounded-lg hover:bg-maroon-dark
                                   transition-colors flex items-center gap-1 cursor-hover">
                        <i class="ph ph-plus"></i> Add New
                    </button>
                </div>
                <!-- Populated by frontend/js/render.js → renderAdminServices() -->
                <div class="space-y-3" id="admin-services-list"></div>
            </div>

            <!-- Catalog Manager — CRUD via backend/api/services.js -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                    <h3 class="font-medium text-lg">Catalog Items</h3>
                    <button onclick="openAddCatalogModal()"
                            class="bg-maroon text-white text-sm px-3 py-1.5 rounded-lg hover:bg-maroon-dark
                                   transition-colors flex items-center gap-1 cursor-hover">
                        <i class="ph ph-plus"></i> Add Item
                    </button>
                </div>
                <!-- Populated by frontend/js/render.js → renderAdminCatalog() -->
                <div class="space-y-3" id="admin-catalog-list"></div>
            </div>

        </div>
    </div>

</div>
