<!-- ══════════════════ PAGE: BOOKING ══════════════════ -->

<div class="min-h-screen bg-white flex items-center">
    <div class="max-w-7xl mx-auto px-6 py-16 w-full grid md:grid-cols-2 gap-16 items-start">

        <!-- Info Panel -->
        <div class="bg-beige p-10 rounded-3xl flex flex-col justify-center sticky top-28">
            <span class="text-maroon uppercase tracking-widest text-sm font-semibold mb-4">Reservation</span>
            <h2 class="font-serif text-4xl md:text-5xl text-maroon mb-6">Reserve Your Time</h2>
            <p class="text-gray-600 mb-8 font-light leading-relaxed">
                Select your desired service, preferred date, and time slot.
                We'll confirm your appointment within 24 hours.
            </p>
            <ul class="space-y-3 text-gray-500 text-sm">
                <li class="flex items-center gap-3">
                    <i class="ph ph-clock text-maroon text-lg"></i>
                    Mon – Sat &nbsp;|&nbsp; 9:00 AM – 7:00 PM
                </li>
                <li class="flex items-center gap-3">
                    <i class="ph ph-map-pin text-maroon text-lg"></i>
                    123 Luxury Ave, California
                </li>
                <li class="flex items-center gap-3">
                    <i class="ph ph-phone text-maroon text-lg"></i>
                    +1 (555) 123-4567
                </li>
            </ul>
        </div>

        <!-- Booking Form — handled by backend/api/appointments.js -->
        <form id="booking-form" class="space-y-6 bg-white py-8">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-2">Full Name *</label>
                <input type="text" id="bf-name" placeholder="Your full name" required
                       class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50
                              focus:border-maroon outline-none transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-2">Service *</label>
                <!-- Populated by frontend/js/render.js → renderBookingDropdown() -->
                <select id="bf-service" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50
                               focus:border-maroon outline-none transition-colors"></select>
            </div>

            <div class="grid sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Date *</label>
                    <input type="date" id="bf-date" required
                           class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50
                                  focus:border-maroon outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-2">Time *</label>
                    <select id="bf-time" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-gray-50
                                   focus:border-maroon outline-none transition-colors">
                        <option value="10:00">10:00 AM</option>
                        <option value="11:30">11:30 AM</option>
                        <option value="13:00">01:00 PM</option>
                        <option value="14:30">02:30 PM</option>
                        <option value="16:00">04:00 PM</option>
                        <option value="17:30">05:30 PM</option>
                    </select>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-maroon text-white py-4 rounded-xl text-lg font-medium
                           hover:bg-maroon-dark transition-colors cursor-hover flex items-center justify-center gap-2">
                <i class="ph ph-calendar-check"></i> Confirm Booking
            </button>
        </form>

    </div>
</div>
